[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redrecon-x"
version = "1.0.0"
description = "Automated Web Reconnaissance & Attack-Surface Intelligence Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {"name" = "AnandBinuArjun"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "sentry-sdk>=2.0.0",
]

[project.scripts]
redrecon = "redrecon.cli.main:main"
